# Runs the commands declared in .dev-factory.json on every pull request into dev and on every
# push to dev. The agent merges a pull request only when this is green (RULE-GIT).
name: ci

on:
  pull_request:
    branches: [dev]
  push:
    branches: [dev]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build
        run: python3 -m compileall -q hooks tools tests
      - name: Test
        run: |
          git config --global user.email ci@example.com
          git config --global user.name ci
          python3 -m unittest discover -s tests -v
